<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><rect width="100%" height="100%" fill="white"/><rect x="25" y="25" width="1450" height="900" rx="8" fill="none" stroke="#111" stroke-width="3"/><text x="750" y="75" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold">TASK 10 — STM32F410 AND WEMOS HTTP INTERFACE</text><line x1="55" y1="100" x2="1445" y2="100" stroke="#111" stroke-width="2"/><text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="21">HTTP server continuation — USART1 connects STM32 to Wemos D1 mini</text><rect x="545" y="245" width="410" height="390" rx="12" fill="#f8f8f8" stroke="#111" stroke-width="3"/><text x="750" y="315" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">STM32F410RBT6</text><text x="750" y="350" text-anchor="middle" font-family="Arial" font-size="20">3.3 V UART logic</text><rect x="85" y="235" width="350" height="410" rx="12" fill="#f7fbff" stroke="#111" stroke-width="3"/><text x="260" y="290" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold">Wemos D1 mini</text><rect x="190" y="325" width="140" height="220" rx="12" fill="#d9e8f5" stroke="#333" stroke-width="2"/><text x="260" y="420" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">ESP8266</text><text x="260" y="455" text-anchor="middle" font-family="Arial" font-size="17">Wi-Fi module</text><text x="260" y="585" text-anchor="middle" font-family="Arial" font-size="18">3V3 UART</text><text x="260" y="615" text-anchor="middle" font-family="Arial" font-size="17">Power via USB / 5V</text><path d="M435 385 H505 V420 H545" fill="none" stroke="#111" stroke-width="3"/><path d="M545 500 H505 V535 H435" fill="none" stroke="#111" stroke-width="3"/><text x="475" y="365" text-anchor="middle" font-family="Arial" font-size="18">TX → RX</text><text x="475" y="560" text-anchor="middle" font-family="Arial" font-size="18">RX ← TX</text><text x="565" y="405" font-family="Arial" font-size="18">USART1 PA10 (RX)</text><text x="565" y="525" font-family="Arial" font-size="18">USART1 PA9 (TX)</text><path d="M260 645 V700 H750 V635" fill="none" stroke="#111" stroke-width="3"/><path d="M735 700 H765 M740 710 H760 M745 720 H755" stroke="#111" stroke-width="3" fill="none"/><text x="500" y="690" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">COMMON GND</text><rect x="70" y="740" width="1360" height="160" rx="8" fill="#fff" stroke="#555" stroke-width="2"/><text x="95" y="778" font-family="Arial" font-size="22" font-weight="bold">Wiring notes</text><text x="100" y="808" font-family="Arial" font-size="17">• Wemos TX (GPIO1) → STM32 PA10 (USART1 RX); Wemos RX (GPIO3) ← STM32 PA9 (USART1 TX).</text><text x="100" y="832" font-family="Arial" font-size="17">• UART settings: 115200 baud, 8 data bits, no parity, 1 stop bit (8-N-1).</text><text x="100" y="856" font-family="Arial" font-size="17">• Connect STM32 GND and Wemos GND. Use 3.3 V UART logic levels.</text><text x="100" y="880" font-family="Arial" font-size="17">• Power Wemos through USB or a regulated supply; never feed 5 V into its 3V3 pin.</text></svg>