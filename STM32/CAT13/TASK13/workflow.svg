<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
<defs><style>
.title{font:bold 30px Arial;fill:#111}.box{fill:#edf5ff;stroke:#315b86;stroke-width:2.5}
.proc{fill:#e8f5ee;stroke:#2e7d50;stroke-width:2.5}.decision{fill:#fff4df;stroke:#a66b00;stroke-width:2.5}
.err{fill:#fff0f0;stroke:#b23b3b;stroke-width:2.5}.txt{font:20px Arial;fill:#111}
.small{font:16px Arial;fill:#333}.line{stroke:#333;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<rect width="1200" height="1500" fill="white"/>
<text x="600" y="55" text-anchor="middle" class="title">BME280 + ESP8266 HTTP Application Flow</text>
<rect x="390" y="100" width="420" height="75" rx="16" class="box"/><text x="600" y="145" text-anchor="middle" class="txt">Start / HAL_Init()</text>
<path d="M600 175 V220" class="line"/>
<rect x="390" y="225" width="420" height="90" rx="16" class="box"/><text x="600" y="260" text-anchor="middle" class="txt">Configure system clock, GPIO,</text><text x="600" y="288" text-anchor="middle" class="txt">I²C1 and USART1</text>
<path d="M600 315 V360" class="line"/>
<rect x="390" y="365" width="420" height="90" rx="16" class="proc"/><text x="600" y="400" text-anchor="middle" class="txt">Initialize Bosch BME280 API</text><text x="600" y="428" text-anchor="middle" class="small">Read chip ID and calibration data</text>
<path d="M600 455 V500" class="line"/>
<polygon points="600,500 780,575 600,650 420,575" class="decision"/><text x="600" y="570" text-anchor="middle" class="txt">Sensor initialized?</text>
<path d="M420 575 H220 V700" class="line"/><text x="300" y="555" class="small">No</text>
<rect x="70" y="705" width="300" height="80" rx="14" class="err"/><text x="220" y="752" text-anchor="middle" class="txt">Error_Handler()</text>
<path d="M600 650 V700" class="line"/><text x="625" y="680" class="small">Yes</text>
<rect x="390" y="705" width="420" height="95" rx="16" class="proc"/><text x="600" y="742" text-anchor="middle" class="txt">Configure oversampling, filter,</text><text x="600" y="772" text-anchor="middle" class="txt">standby time and normal mode</text>
<path d="M600 800 V845" class="line"/>
<rect x="390" y="850" width="420" height="95" rx="16" class="proc"/><text x="600" y="888" text-anchor="middle" class="txt">Initialize ESP8266 with AT commands</text><text x="600" y="918" text-anchor="middle" class="small">Join Wi-Fi • enable TCP server • port 80</text>
<path d="M600 945 V990" class="line"/>
<rect x="390" y="995" width="420" height="90" rx="16" class="proc"/><text x="600" y="1030" text-anchor="middle" class="txt">Read compensated T / P / H values</text><text x="600" y="1060" text-anchor="middle" class="small">Update values once per second</text>
<path d="M600 1085 V1130" class="line"/>
<rect x="390" y="1135" width="420" height="95" rx="16" class="box"/><text x="600" y="1173" text-anchor="middle" class="txt">Wait for HTTP request from browser</text><text x="600" y="1203" text-anchor="middle" class="small">or Node-RED through ESP8266</text>
<path d="M600 1230 V1275" class="line"/>
<rect x="390" y="1280" width="420" height="95" rx="16" class="proc"/><text x="600" y="1318" text-anchor="middle" class="txt">Build JSON + HTTP headers</text><text x="600" y="1348" text-anchor="middle" class="small">Calculate Content-Length and send via CIPSEND</text>
<path d="M810 1328 H1000 V1038 H820" class="line"/><text x="1008" y="1180" class="small" transform="rotate(-90 1008 1180)">Repeat</text>
<text x="600" y="1435" text-anchor="middle" class="small">Node-RED reads /sensor and calculates minimum, maximum and average values.</text>
</svg>